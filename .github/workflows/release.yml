name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate app icon
        run: swift Scripts/generate_icon.swift

      - name: Build universal .app
        run: Scripts/build_app.sh release

      - name: Package .dmg
        run: Scripts/make_dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Motif-${{ github.ref_name }}
          path: |
            build/Motif.app
            build/Motif.dmg
          retention-days: 90

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Motif.dmg
          generate_release_notes: true
